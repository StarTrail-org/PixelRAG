name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint with ruff
        run: uvx ruff check .

      - name: Check formatting with ruff
        run: uvx ruff format --check .

  demo-tests:
    name: Demo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each demo is its own uv project depending on the repo root via a path
      # source, so `pytest tests/` never reached them. Run every demo that has
      # tests, in its own environment.
      - name: Run demo test suites
        run: |
          set -euo pipefail
          shopt -s nullglob  # no demos/ projects must not iterate the literal glob
          found=0
          for proj in demos/*/pyproject.toml; do
            dir="$(dirname "$proj")"
            if ! compgen -G "$dir/test_*.py" > /dev/null && ! [ -d "$dir/tests" ]; then
              echo "::notice::$dir has no tests, skipping"
              continue
            fi
            echo "--- $dir ---"
            uv run --project "$dir" --group dev pytest "$dir" -q
            found=$((found + 1))
          done
          echo "ran $found demo test suite(s)"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (core + dev)
        run: uv sync --extra dev

      - name: Chrome runtime libraries
        run: npx -y playwright install-deps chromium

      - name: Cache patched Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/pixelrag/chrome
          key: pixelrag-chrome-150.0.7844.0

      - name: Download patched Chrome (cached after first run)
        run: uv run pixelshot install-chrome

      - name: Run tests
        env:
          # Chrome's sandbox cannot initialise on the hosted runner (no user
          # namespaces, no SUID helper), so every render test fails to launch
          # Chrome at all: "Failed to connect to Chrome on port 12000".
          # Opt out here rather than weakening sandbox_args(): the runner is a
          # disposable VM rendering known fixtures, while real users -- who
          # point this at pages they do not control -- keep the sandbox on.
          PIXELSHOT_NO_SANDBOX: "1"
        run: uv run pytest tests/ -v

  plugin-validate:
    name: Plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace + plugin
        run: |
          claude plugin validate .
          claude plugin validate ./plugin
