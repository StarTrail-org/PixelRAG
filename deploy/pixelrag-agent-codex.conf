# Install as /etc/systemd/system/pixelrag-agent.service.d/codex.conf.
# This machine's working Codex login belongs to zlab-ssd1. The service must
# run under that account to use it; do not copy auth tokens between users.
[Service]
User=zlab-ssd1
Group=zlab-ssd1
WorkingDirectory=/home/yichuan/visrag/web
Environment=HOME=/home/zlab-ssd1
Environment=CODEX_HOME=/home/zlab-ssd1/.codex
Environment=CHAT_BACKEND=codex
Environment=CODEX_BIN=/home/zlab-ssd1/.local/bin/codex
Environment=CHAT_CODEX_TIMEOUT_MS=180000
ExecStart=
ExecStart=/home/yichuan/.nix-profile/bin/node /home/yichuan/visrag/web/agent-server.mjs
